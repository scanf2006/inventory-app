name: Daily Bulk Oil report

on:
  schedule:
    # Backup trigger. GitHub cron is UTC and often runs late or skips runs, so it
    # fires every 10 minutes from 5:00 PM to about 8:00 PM Toronto time (summer and
    # winter). The main trigger is Supabase (docs/daily-report.md), which starts
    # this workflow with mode "scheduled". The script sends at most once per day,
    # from 5:30 PM Toronto time, so extra runs just exit.
    - cron: "*/10 21-23 * * 1-5"
    - cron: "*/10 0 * * 2-6"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = send now without saving today's values; preview = build only, no email; scheduled = normal daily run"
        type: choice
        options: [test, preview, scheduled]
        default: test

concurrency:
  group: daily-bulk-oil-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send report
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          # Only for the admin-approved setup (leave these secrets unset otherwise)
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          case "${{ github.event_name }}:${{ inputs.mode }}" in
            workflow_dispatch:preview)   node scripts/daily-report/send-daily-report.js --dry-run ;;
            workflow_dispatch:scheduled) node scripts/daily-report/send-daily-report.js ;;
            workflow_dispatch:*)         node scripts/daily-report/send-daily-report.js --force ;;
            *)                           node scripts/daily-report/send-daily-report.js ;;
          esac
