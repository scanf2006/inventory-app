name: Daily Bulk Oil report

on:
  schedule:
    # GitHub cron is UTC. Toronto 5:30 PM is 21:30 UTC in summer and 22:30 UTC in winter;
    # the script only sends once per weekday, from 5:00 PM Toronto time. Later runs are backups.
    - cron: "30 21,22,23 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = send now without saving today's values; preview = build only, no email"
        type: choice
        options: [test, preview]
        default: test

concurrency:
  group: daily-bulk-oil-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send report
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          # Only for the admin-approved setup (leave these secrets unset otherwise)
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          case "${{ github.event_name }}:${{ inputs.mode }}" in
            workflow_dispatch:preview) node scripts/daily-report/send-daily-report.js --dry-run ;;
            workflow_dispatch:*)       node scripts/daily-report/send-daily-report.js --force ;;
            *)                         node scripts/daily-report/send-daily-report.js ;;
          esac
